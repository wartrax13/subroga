[project]
name = "sub-roga-backend"
version = "0.1.0"
description = "MVP: organiza PDFs de sinistro e gera dossiê + minuta de ação regressiva"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlmodel>=0.0.16",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "pypdf>=4.2",
    "pypdfium2>=4.28",
    "reportlab>=4.1",
    "anthropic>=0.40",
    "docxtpl>=0.17",
    "python-docx>=1.1",
    "openai>=3.46.0",
    "pyjwt>=2.15.1",
    "bcrypt>=5.0.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
